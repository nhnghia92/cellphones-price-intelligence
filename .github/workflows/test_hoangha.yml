name: Test Hoang Ha Scraper

on:
  workflow_dispatch:

jobs:
  test-hoangha:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Hoang Ha scraper
        run: |
          python - <<'PY'
          from scrapers.hoanghamobile import scrape

          products = [
              {
                  "brand": "Belkin",
                  "product_id": "WCA013",
                  "product_name": "Belkin 45W Charger",
                  "url": "https://hoanghamobile.com/cu-sac/cu-sac-nhanh-belkin-45w-1-cong-usb-c-pd-3-0-pps-gann",
              }
          ]

          results = scrape(products)

          print("")
          print("========== FINAL RESULTS ==========")

          for result in results:
              print(result)

          print("===================================")
          PY
