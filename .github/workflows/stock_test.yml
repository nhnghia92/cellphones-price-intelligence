name: Test CellphoneS City Stock

on:
  workflow_dispatch:

jobs:
  stock-city-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Create city stock test
        run: |
          cat > test_city_stock.py <<'PY'
          import re
          from playwright.sync_api import sync_playwright

          URL = "https://cellphones.com.vn/cu-sac-nhanh-belkin-20w-1-cong-usb-c-pd-pps-cubic-wall-charger-cu.html"

          CITIES = [
              ("HCM", "Hồ Chí Minh"),
              ("HNI", "Hà Nội"),
              ("CTO", "Cần Thơ"),
              ("DAN", "Đà Nẵng"),
          ]


          def get_stock_count(page):
              body = page.locator("body").inner_text()

              patterns = [
                  r"Có\s+(\d+)\s+cửa hàng có sản phẩm",
                  r"Có\s+(\d+)\s+cửa hàng có hàng",
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      body,
                      re.IGNORECASE
                  )

                  if match:
                      return int(match.group(1))

              return None


          def modal_is_open(page):
              modal = page.locator(
                  "#teleport-modal.teleport-modal-change-province"
              )

              return modal.count() > 0 and modal.first.is_visible()


          def open_modal(page):
              if modal_is_open(page):
                  print("Province modal already open.")
                  return True

              print("Opening province modal...")

              selector = page.locator(
                  ".box-on-stock-option.button__change-province"
              )

              if selector.count() == 0:
                  print(
                      "Stock province selector not found."
                  )
                  return False

              try:
                  selector.first.click(
                      timeout=5000
                  )

                  page.wait_for_timeout(800)

                  print("Province modal opened.")

                  return modal_is_open(page)

              except Exception as error:
                  print(
                      "Could not open province modal:",
                      error
                  )

                  return False


          def click_city(page, city_name):
              print(
                  f"Clicking city: {city_name}"
              )

              modal = page.locator(
                  "#teleport-modal.teleport-modal-change-province"
              )

              if modal.count() == 0:
                  print("Province modal not found.")
                  return False

              city = modal.get_by_text(
                  city_name,
                  exact=True
              )

              count = city.count()

              print(
                  f"{city_name} elements in modal: {count}"
              )

              if count == 0:
                  print(
                      f"{city_name} not found in modal."
                  )
                  return False

              for i in range(count):
                  try:
                      element = city.nth(i)

                      if not element.is_visible():
                          continue

                      element.click(
                          timeout=5000
                      )

                      page.wait_for_timeout(1800)

                      print(
                          f"{city_name} clicked."
                      )

                      return True

                  except Exception as error:
                      print(
                          f"Click attempt {i} failed:",
                          error
                      )

              return False


          def main():

              print("")
              print(
                  "========================================"
              )
              print(
                  "CELLPHONES CITY STOCK TEST"
              )
              print(
                  "========================================"
              )

              results = {}

              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )

                  page = browser.new_page(
                      viewport={
                          "width": 1440,
                          "height": 1000
                      }
                  )

                  print("")
                  print("Opening product...")

                  page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=30000
                  )

                  page.wait_for_timeout(5000)

                  print("Product loaded.")

                  print("")
                  print(
                      "================================"
                  )
                  print("TESTING HCM")
                  print(
                      "================================"
                  )

                  if open_modal(page):

                      if click_city(
                          page,
                          "Hồ Chí Minh"
                      ):

                          count = get_stock_count(page)

                          results["HCM"] = count

                          print(
                              "HCM:",
                              count
                          )

                  print("")
                  print(
                      "================================"
                  )
                  print("TESTING HNI")
                  print(
                      "================================"
                  )

                  if open_modal(page):

                      if click_city(
                          page,
                          "Hà Nội"
                      ):

                          count = get_stock_count(page)

                          results["HNI"] = count

                          print(
                              "HNI:",
                              count
                          )

                  print("")
                  print(
                      "================================"
                  )
                  print("TESTING CTO")
                  print(
                      "================================"
                  )

                  if open_modal(page):

                      if click_city(
                          page,
                          "Cần Thơ"
                      ):

                          count = get_stock_count(page)

                          results["CTO"] = count

                          print(
                              "CTO:",
                              count
                          )

                  print("")
                  print(
                      "================================"
                  )
                  print("TESTING DAN")
                  print(
                      "================================"
                  )

                  if open_modal(page):

                      if click_city(
                          page,
                          "Đà Nẵng"
                      ):

                          count = get_stock_count(page)

                          results["DAN"] = count

                          print(
                              "DAN:",
                              count
                          )

                  print("")
                  print(
                      "========================================"
                  )
                  print("FINAL RESULT")
                  print(
                      "========================================"
                  )

                  for code, _ in CITIES:

                      value = results.get(code)

                      if value is None:
                          print(
                              f"{code}: NOT FOUND"
                          )
                      else:
                          print(
                              f"{code}: {value}"
                          )

                  print("")
                  print(
                      "========================================"
                  )
                  print("TEST COMPLETED")
                  print(
                      "========================================"
                  )

                  browser.close()


          if __name__ == "__main__":
              main()
          PY

      - name: Run city stock test
        run: |
          python test_stock_cellphones.py
