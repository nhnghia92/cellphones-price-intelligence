name: Test CellphoneS City Stock

on:
  workflow_dispatch:

jobs:
  stock-city-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Create city stock test
        run: |
          cat > test_city_stock.py <<'PY'
          import re
          from playwright.sync_api import sync_playwright

          URL = "https://cellphones.com.vn/cu-sac-nhanh-belkin-20w-1-cong-usb-c-pd-pps-cubic-wall-charger-cu.html"

          CITIES = [
              ("HCM", "Hồ Chí Minh"),
              ("HNI", "Hà Nội"),
              ("CTO", "Cần Thơ"),
              ("DAN", "Đà Nẵng"),
          ]


          def get_stock_count(page):
              try:
                  body = page.locator("body").inner_text()

                  patterns = [
                      r"Có\s+(\d+)\s+cửa hàng có sản phẩm",
                      r"Có\s+(\d+)\s+cửa hàng có hàng",
                  ]

                  for pattern in patterns:
                      match = re.search(
                          pattern,
                          body,
                          re.IGNORECASE
                      )

                      if match:
                          return int(match.group(1))

              except Exception as error:
                  print(
                      "Stock count error:",
                      error
                  )

              return None


          def open_city_selector(page):
              selector = page.locator(
                  ".button__change-province"
              )

              count = selector.count()

              print(
                  "Province selector count:",
                  count
              )

              if count == 0:
                  print(
                      "ERROR: province selector not found"
                  )
                  return False

              try:
                  selector.first.click(
                      timeout=5000
                  )

                  page.wait_for_timeout(800)

                  return True

              except Exception as error:
                  print(
                      "Could not open province selector:",
                      error
                  )

                  return False


          def select_city(page, city_name):
              print(
                  f"Selecting city: {city_name}"
              )

              candidates = page.get_by_text(
                  city_name,
                  exact=True
              )

              count = candidates.count()

              print(
                  f"City elements found: {count}"
              )

              if count == 0:
                  print(
                      f"ERROR: {city_name} not found"
                  )
                  return False

              for i in range(count):
                  try:
                      element = candidates.nth(i)

                      visible = element.is_visible()

                      if not visible:
                          continue

                      print(
                          f"Clicking visible {city_name} "
                          f"element {i}"
                      )

                      element.click(
                          timeout=5000
                      )

                      page.wait_for_timeout(1500)

                      return True

                  except Exception as error:
                      print(
                          f"Click attempt {i} failed:",
                          error
                      )

              return False


          def main():

              print("")
              print(
                  "========================================"
              )
              print(
                  "CELLPHONES CITY STOCK TEST"
              )
              print(
                  "========================================"
              )

              results = {}

              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )

                  page = browser.new_page(
                      viewport={
                          "width": 1440,
                          "height": 1000
                      }
                  )

                  print("")
                  print(
                      "Opening product..."
                  )

                  page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=30000
                  )

                  page.wait_for_timeout(5000)

                  print(
                      "Product loaded."
                  )

                  for code, city_name in CITIES:

                      print("")
                      print(
                          "================================"
                      )
                      print(
                          f"TESTING {code} - {city_name}"
                      )
                      print(
                          "================================"
                      )

                      if not open_city_selector(page):
                          results[code] = None
                          continue

                      if not select_city(
                          page,
                          city_name
                      ):
                          results[code] = None
                          continue

                      page.wait_for_timeout(2000)

                      count = get_stock_count(page)

                      results[code] = count

                      if count is None:
                          print(
                              f"{code}: STOCK COUNT NOT FOUND"
                          )
                      else:
                          print(
                              f"{code}: "
                              f"{count} stores with stock"
                          )

                  print("")
                  print(
                      "========================================"
                  )
                  print(
                      "FINAL RESULT"
                  )
                  print(
                      "========================================"
                  )

                  for code, count in results.items():

                      if count is None:
                          print(
                              f"{code}: NOT FOUND"
                          )
                      else:
                          print(
                              f"{code}: {count}"
                          )

                  print("")
                  print(
                      "========================================"
                  )
                  print(
                      "TEST COMPLETED"
                  )
                  print(
                      "========================================"
                  )

                  browser.close()


          if __name__ == "__main__":
              main()
          PY

      - name: Run city stock test
        run: |
          python test_city_stock.py
